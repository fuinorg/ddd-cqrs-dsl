name: IntelliJ Plugin Build
run-name: "[INTELLIJ] ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - '**'
    paths:
      - 'intellij/**'
      - '.github/workflows/intellij.yml'
      - '!**/README.md'
      - '!**/CHANGELOG.md'
  pull_request:
    branches:
      - '**'
    paths:
      - 'intellij/**'
      - '.github/workflows/intellij.yml'
      - '!**/README.md'
      - '!**/CHANGELOG.md'

jobs:
  build:

    defaults:
      run:
        shell: bash
        working-directory: intellij

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # JDK 25 builds/runs the plugin; JDK 21 is used by the Grammar-Kit code generation tasks.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show versions
        run: java -version && ./gradlew --version

      - name: Build, test and verify the plugin
        run: ./gradlew --no-daemon buildPlugin test verifyPlugin

      - name: Upload plugin artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cqrs-dsl-intellij-plugin
          path: |
            intellij/build/distributions/*.zip
            intellij/build/distributions/updatePlugins.xml
          if-no-files-found: ignore

      - name: Publish to Artifactory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          P2_USER: ${{ secrets.P2_USER }}
          P2_TOKEN: ${{ secrets.P2_TOKEN }}
        run: ./gradlew --no-daemon publishToArtifactory
