###############################################################################
# Master configuration for the headless org.eclipse.pde.build run.
#
# This is the "builder" directory referenced by build.sh via -Dbuilder=.
# It drives org.eclipse.pde.build/scripts/build.xml to compile the plugins and
# assemble the feature into a p2 update site -- pure PDE, no Maven/Tycho.
#
# Values that change per machine/run (baseLocation, buildDirectory,
# forceContextQualifier) are passed on the command line by build.sh and must NOT
# be hard-coded here.
###############################################################################

# ---- What to build -----------------------------------------------------------
# A single top-level feature; its included plugins are built transitively.
topLevelElementType=feature
topLevelElementId=org.fuin.dsl.cqrs.feature
product=

# ---- Platform(s) to build for ------------------------------------------------
# The plugins are platform independent (pure Java), so build one config: *,*,*.
configs=*, *, *

# Emit folders (an exploded p2 repo) rather than zipped archives.
archivesFormat=*, *, *-folder

# ---- Source layout / fetching ------------------------------------------------
# build.sh copies the plugin and feature projects into ${buildDirectory}/plugins
# and ${buildDirectory}/features, so there is nothing to fetch from SCM.
skipFetch=true
skipMaps=true
# Reuse the provisioned Eclipse (baseLocation) as the prebuilt target; do not try
# to build the base platform.
skipBase=true

# ---- Compiler settings -------------------------------------------------------
# Compile against the BREE JavaSE-21 using the JDK 21 that runs the build.
# Modern JDKs have no rt.jar, so no bootclasspath is supplied; source/target 21.
javacSource=21
javacTarget=21
javacFailOnError=true
javacDebugInfo=true
javacVerbose=false
# Provide an (empty) profile entry so PDE build does not error on a missing
# JavaSE-21 bootclasspath; compilation uses the running JDK's class library.
JavaSE-21=

# ---- p2 update site output ---------------------------------------------------
# Gather the build output directly into a p2 repository. PDE build writes it to
# ${p2.build.repo} (default file:${buildDirectory}/buildRepo); build.sh reads it there.
p2.gathering=true
p2.build.repo=file:${buildDirectory}/buildRepo
p2.metadata.repo.name=CqrsDsl Update Site
p2.artifact.repo.name=CqrsDsl Update Site
p2.compress=true
p2.flavor=tooling
p2.publish.artifacts=true

# ---- Source bundles / source feature -----------------------------------------
# Generate one source bundle per plugin; the source feature itself is declared in
# eclipse/org.fuin.dsl.cqrs.feature/build.properties (generate.feature@...source).
individualSourceBundles=true

# ---- Version qualifier -------------------------------------------------------
# forceContextQualifier is supplied by build.sh (a UTC timestamp) so 1.0.0.qualifier
# becomes e.g. 1.0.0.202606071200. Do not append an extra generated suffix.
generateFeatureVersionSuffix=false
