# Logging configuration for the DDD/CQRS DSL UI plugin.
#
# Loaded programmatically by CqrsDslUiActivator (registered as the Bundle-Activator)
# so that it configures ONLY this plugin's logger and never resets the global
# reload4j/Log4j configuration that Eclipse and Xtext share. Because no
# "log4j.rootLogger" is defined here, PropertyConfigurator leaves the root logger
# (and every other bundle's logging) untouched.
#
# Change the level below to DEBUG for more detail, or to WARN/ERROR to silence the
# remote-scope diagnostics emitted by org.fuin.dsl.cqrs.
log4j.logger.org.fuin.dsl.cqrs=INFO, cqrs
log4j.additivity.org.fuin.dsl.cqrs=false

log4j.appender.cqrs=org.apache.log4j.ConsoleAppender
log4j.appender.cqrs.Target=System.out
log4j.appender.cqrs.layout=org.apache.log4j.PatternLayout
log4j.appender.cqrs.layout.ConversionPattern=%-5p %c - %m%n
