<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'Segoe UI', Verdana, sans-serif" role="img" aria-label="Work in progress">
  <title>Work in progress</title>

  <!-- background -->
  <rect x="0" y="0" width="800" height="320" rx="18" fill="#fffdf3"/>

  <!-- hazard-stripe border -->
  <defs>
    <pattern id="hazard" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="#f9c80e"/>
      <rect width="20" height="40" fill="#1c1c1c"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="320" rx="18" fill="none" stroke="url(#hazard)" stroke-width="16"/>

  <!-- title -->
  <text x="400" y="64" text-anchor="middle" font-size="42" font-weight="bold" fill="#1c1c1c">
    🚧 WORK IN PROGRESS 🚧
  </text>
  <text x="400" y="96" text-anchor="middle" font-size="16" fill="#6b6b6b" font-style="italic">
    Our DSL elves are still hammering this together&#8230;
  </text>

  <!-- ground line -->
  <line x1="60" y1="262" x2="740" y2="262" stroke="#cdbf8e" stroke-width="4" stroke-linecap="round"/>

  <!-- the hard-working coder blob -->
  <g transform="translate(150 150)">
    <!-- body -->
    <ellipse cx="0" cy="80" rx="58" ry="46" fill="#5bc0eb"/>
    <ellipse cx="0" cy="80" rx="58" ry="46" fill="none" stroke="#2a8fc0" stroke-width="3"/>
    <!-- eyes -->
    <circle cx="-18" cy="68" r="8" fill="#fff"/>
    <circle cx="18" cy="68" r="8" fill="#fff"/>
    <circle cx="-16" cy="70" r="4" fill="#1c1c1c"/>
    <circle cx="20" cy="70" r="4" fill="#1c1c1c"/>
    <!-- determined mouth -->
    <path d="M -16 96 Q 0 108 16 96" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>
    <!-- sweat drop (hard at work) -->
    <path d="M 34 60 q 6 10 0 16 q -6 -6 0 -16 z" fill="#7fd3f7"/>
    <!-- hard hat -->
    <path d="M -46 52 a 46 40 0 0 1 92 0 z" fill="#f9c80e" stroke="#d9a900" stroke-width="3"/>
    <rect x="-52" y="50" width="104" height="10" rx="5" fill="#f9c80e" stroke="#d9a900" stroke-width="3"/>
    <rect x="-6" y="18" width="12" height="20" rx="3" fill="#d9a900"/>
    <!-- little hammer in hand -->
    <g transform="translate(60 92) rotate(20)">
      <rect x="0" y="-3" width="44" height="6" rx="3" fill="#8a5a2b"/>
      <rect x="40" y="-14" width="20" height="28" rx="4" fill="#9aa0a6" stroke="#6b7075" stroke-width="2"/>
    </g>
  </g>

  <!-- scattered DSL keyword bricks -->
  <g font-size="14" font-weight="bold" font-family="'Consolas','Courier New',monospace">
    <g transform="translate(420 150)">
      <rect width="118" height="34" rx="6" fill="#ffe28a" stroke="#d9a900" stroke-width="2"/>
      <text x="59" y="23" text-anchor="middle" fill="#5a4500">aggregate</text>
    </g>
    <g transform="translate(560 130) rotate(-6)">
      <rect width="92" height="34" rx="6" fill="#cdeac0" stroke="#79b06a" stroke-width="2"/>
      <text x="46" y="23" text-anchor="middle" fill="#2f5a26">entity</text>
    </g>
    <g transform="translate(470 200) rotate(4)">
      <rect width="132" height="34" rx="6" fill="#f7c5c5" stroke="#cd7d7d" stroke-width="2"/>
      <text x="66" y="23" text-anchor="middle" fill="#7a2f2f">valueObject</text>
    </g>
    <g transform="translate(620 196) rotate(-3)">
      <rect width="78" height="34" rx="6" fill="#c7d6ff" stroke="#7d93cd" stroke-width="2"/>
      <text x="39" y="23" text-anchor="middle" fill="#2f3f7a">event</text>
    </g>
  </g>

  <!-- funny 404 sign on a post -->
  <g transform="translate(700 150)">
    <rect x="-4" y="0" width="8" height="112" fill="#8a5a2b"/>
    <g transform="translate(-58 -36) rotate(-4)">
      <rect width="116" height="56" rx="6" fill="#1c1c1c"/>
      <text x="58" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#f9c80e">ERROR 404</text>
      <text x="58" y="44" text-anchor="middle" font-size="11" fill="#fffdf3">feature not built yet</text>
    </g>
  </g>

  <!-- tiny traffic cone -->
  <g transform="translate(300 226)">
    <polygon points="0,0 14,34 -14,34" fill="#ff6b35"/>
    <rect x="-9" y="22" width="18" height="5" fill="#fffdf3"/>
    <rect x="-18" y="34" width="36" height="6" rx="2" fill="#e05a2b"/>
  </g>
</svg>
