import org.jetbrains.intellij.platform.gradle.TestFrameworkType
import org.jetbrains.intellij.platform.gradle.tasks.GenerateLexerTask
import org.jetbrains.intellij.platform.gradle.tasks.GenerateParserTask

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
    // GrammarKit support now ships with the IntelliJ Platform Gradle Plugin. The standalone
    // org.jetbrains.grammarkit plugin was archived in August 2026 (2023.3.0.4 was its last release)
    // and its README points here.
    id 'org.jetbrains.intellij.platform.grammarkit' version '2.18.1'
}

group = providers.gradleProperty('pluginGroup').get()
version = providers.gradleProperty('pluginVersion').get()

repositories {
    mavenLocal()
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        // Since 2025.3 (253) the separate Community artifact (ideaIC) is no longer published;
        // 2026.1 uses the unified IntelliJ IDEA distribution.
        intellijIdea providers.gradleProperty('platformVersion')
        // The IDE's own Maven support resolves a model 'dependency' (see MavenArtifactResolver), so
        // the user's settings.xml - mirrors, servers, proxies - applies exactly as in the IDE.
        bundledPlugin 'org.jetbrains.idea.maven'
        // MavenArtifactInfo extends MavenCoordinate, which ships in the repository-search plugin.
        bundledPlugin 'org.jetbrains.idea.reposearch'
        testFramework TestFrameworkType.Platform.INSTANCE
    }
    // Gson is bundled with the IntelliJ Platform, so it is provided at runtime; compile against it only.
    compileOnly 'com.google.code.gson:gson:2.11.0'
    // Validates a hint's JSON against the shared JSON schemas. The IntelliJ platform already provides
    // the Kotlin stdlib, so exclude it (and rely on the platform's) rather than bundle a second copy;
    // jmail + snakeyaml are small and bundled with the plugin.
    implementation('com.github.erosb:json-sKema:0.31.0') {
        exclude group: 'org.jetbrains.kotlin'
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// ---------------------------------------------------------------------------
// Grammar-Kit: generate the lexer (JFlex) and the parser/PSI (BNF).
// ---------------------------------------------------------------------------
// The generator tooling comes from the org.jetbrains.intellij.platform.grammarkit subplugin, which
// resolves Grammar-Kit and JFlex itself. The standalone plugin needed a 2022.3 (build 223) IntelliJ
// core pinned onto a 'grammarKitClassPath' configuration - and a Java 21 toolchain, because that
// core predates JDK 25. None of that is needed any more.
//
// The two generators write to separate roots. They used to share one, and because the parser purges
// its output root, the lexer had to be ordered after it or its file was deleted. Separate roots are
// the subplugin's own default and remove the ordering constraint along with the reason for it.
def generatedParserRoot = layout.buildDirectory.dir('generated/sources/grammarkit-parser/java/main')
def generatedLexerRoot = layout.buildDirectory.dir('generated/sources/grammarkit-lexer/java/main')

def generateCqrsParser = tasks.register('generateCqrsParser', GenerateParserTask) {
    sourceFile = file('src/main/grammar/CqrsDsl.bnf')
    targetRootOutputDir = generatedParserRoot
    pathToParser = 'org/fuin/dsl/cqrs/intellij/parser/CqrsParser.java'
    pathToPsiRoot = 'org/fuin/dsl/cqrs/intellij/psi'
    purgeOldFiles = true
}

def generateCqrsLexer = tasks.register('generateCqrsLexer', GenerateLexerTask) {
    sourceFile = file('src/main/grammar/CqrsDsl.flex')
    // The package subdirectory no longer has to be spelled out: the task reads the 'package'
    // declaration at the top of CqrsDsl.flex and generates below it.
    targetRootOutputDir = generatedLexerRoot
    // What purgeOldFiles is allowed to delete. Without it the task warns and purges nothing, which
    // is the safe half of the behaviour the shared-output-root fix introduced.
    pathToClass = 'org/fuin/dsl/cqrs/intellij/lexer/_CqrsDslLexer.java'
    purgeOldFiles = true
}

// The JSON schemas live in the Eclipse core bundle (single source of truth); copy them into the
// plugin's resources at build time so they are on the classpath as /org/fuin/dsl/cqrs/schema/*.
def schemaSource = file('../eclipse/org.fuin.dsl.cqrs/src/org/fuin/dsl/cqrs/schema')
def schemaGeneratedRoot = layout.buildDirectory.dir('generated/schema')

def copyHintSchemas = tasks.register('copyHintSchemas', Copy) {
    from(schemaSource) {
        include '*.schema.json'
    }
    into schemaGeneratedRoot.map { it.dir('org/fuin/dsl/cqrs/schema') }
}

sourceSets {
    main {
        java {
            srcDir generatedParserRoot
            srcDir generatedLexerRoot
        }
        resources {
            srcDir schemaGeneratedRoot
        }
    }
}

tasks.named('compileJava') {
    dependsOn generateCqrsLexer, generateCqrsParser
}

tasks.named('processResources') {
    dependsOn copyHintSchemas
}

// Single source of truth for the marketplace texts. These feed both the patched plugin.xml
// (Overview / What's new for an installed plugin) and the custom repository's updatePlugins.xml
// (Overview / What's new shown while browsing the repository before install).
ext.pluginDescription = '''\
Editor support for the DDD/CQRS DSL (<code>*.cqrs</code> files): syntax highlighting and
code completion for contexts, modules, value-objects, entities, aggregates, events,
commands, exceptions and more.
<ul>
    <li>Syntax highlighting (keywords, strings, numbers, comments, doc comments).</li>
    <li>Reference-aware code completion, go-to-definition, find-usages and rename.</li>
    <li>Code folding for <code>{ }</code> blocks and multi-line comments.</li>
    <li>Structure view of the domain model, and its declarations below the file in the Project view
        (<b>Show Members</b>).</li>
    <li>Resolution of references into models a declared <code>dependency</code> provides &ndash; read
        in place out of a Maven <code>zip</code> artifact, or from a <code>local</code> directory
        &ndash; exactly as the Eclipse plugin and the SrcGen4J build do it.</li>
</ul>
Licensed under LGPL v3.'''

ext.pluginChangeNotes = '''\
<ul>
    <li><b>1.33.0</b> &ndash; An operation can say it checks a business <code>key</code>, naming it
        where it names a <code>business-rule</code>: the resolver used to accept only a rule
        declaration there, so a correct model was marked as broken. The editor also refuses what the
        build refuses - a key needs an exception exactly when it refuses a collision, a type is
        displayed by at most one key, and a <code>display-as</code> format may only name attributes
        the declaring type has.</li>
    <li><b>1.32.0</b> &ndash; <code>entity-id-path</code> declares how an entity is addressed from its
        root, with an optional <code>[min..max]</code> range on a step that may repeat; an entity id is
        unique inside its root and nowhere else, so a reference carrying only the id addresses nothing.
        <code>own-path</code> hands a rule or a service that address, beside <code>own-id</code>. Both
        are checked in the editor.</li>
    <li><b>1.31.0</b> &ndash; A row that offers a command it cannot decide is now reported as a
        warning, the same rule the Eclipse plugin and the generator build apply: a command gated by a
        rule over the aggregate's own state can be left out of a menu rather than offered and refused,
        and the client decides that from what the row publishes - so a row omitting what the gate reads
        makes the gate work on one screen and quietly do nothing on another. A warning rather than an
        error, because whether the row should publish it is a modelling decision with real costs on the
        other side. The lookup is cached per change, so it costs nothing while typing.
        The grammar gained the constructs for business keys and generated
        business rules. A read model row names its identity with <code>identified-by</code>; an aggregate
        or entity declares a <code>key</code> or states <code>no-key</code> on purpose. A
        <code>business-rule</code> declares the attributes it is handed and a <code>requires</code>
        condition over them, and a rule usage binds its actuals - including the carrier's own identity
        with <code>own-id</code> and its prior state with <code>own</code>. A <code>command</code>
        carries its own wording, and a <code>hint</code> may sit wherever wording may.</li>
    <li><b>1.30.0</b> &ndash; A dependency cycle between modules is now reported as an error, the same
        rule the Eclipse plugin and the generator build apply. What a module depends on is read from
        the references that actually resolve rather than from its <code>import</code> lines, so an
        unused import no longer invents a dependency and a fully qualified reference no longer hides
        one. The graph is cached per change, so the check costs nothing while typing.</li>
    <li><b>1.29.0</b> &ndash; A <code>module</code>, a <code>view</code> and a <code>method</code> may
        now carry UI meta information - the same
        <code>slabel</code>/<code>label</code>/<code>tooltip</code>/<code>prompt</code>/<code>examples</code>
        block a type and an attribute take, written at the top of the block. A module name is a single
        lowercase identifier and a view name is a type name, so neither can be turned into a caption by
        any rule a client could write - <code>businesspartners</code> is not "Business partners". What
        to call a module in a menu, a view on a tab and a method as a screen title is now something the
        model states rather than something each application invents from an identifier.</li>
    <li><b>1.28.1</b> &ndash; Build only: the plugin is now built with IntelliJ Platform Gradle Plugin
        2.18.1, and Grammar-Kit generation moved to its <code>grammarkit</code> subplugin - the
        standalone one was archived. No change to what the plugin does.</li>
    <li><b>1.28.0</b> &ndash; An <code>enum</code> instance may now carry UI meta information - the
        same <code>slabel</code>/<code>label</code>/<code>tooltip</code>/<code>prompt</code>/<code>examples</code>
        block an attribute takes, written after the instance name. What to call a constant on screen is
        now something the model states rather than something each application derives from the
        constant's name.</li>
    <li><b>1.27.0</b> &ndash; The Project tool window now shows what a model declares. A
        <code>.cqrs</code> file expands into its contexts and modules, then the types in them, then
        their <code>business-rule</code>s, <code>constructor</code>s and <code>method</code>s - so a
        model can be navigated without opening it first. The rows follow the view's own <b>Show
        Members</b> setting, and each carries an icon saying what it is. It stops at the operation:
        parameters, and the <code>service</code> and <code>event</code> an operation declares for its
        own use, are how a declaration reads rather than a place to steer to, and listing them would
        double the height of the tree. The Structure view (Alt+7) is unchanged and still shows
        everything.<br> New action <b>Tools | Refresh CQRS Model Dependencies</b>. What a
        <code>dependency</code> resolved to was cached until the IDE was restarted, so an artifact
        rebuilt or re-resolved outside it kept answering with what was true at startup - and a stale
        archive reads as a broken <code>import</code>, because only the modules added since go red. The
        action drops those caches and re-highlights the open files.</li>
    <li><b>1.26.0</b> &ndash; A <code>business-rule</code> may now be declared at module level, not only
        inside an entity or an aggregate. A rule that means the same thing everywhere - "the entity must
        not be deleted" - is stated once and imported like any other type, so its name, its exception and
        its consistency classification cannot drift apart across contexts. An aggregate may still declare
        its own rules, and one it declares itself still wins over an imported rule of the same name; a
        rule written inside an aggregate is no longer flagged as an illegal nested element.</li>
    <li><b>1.25.0</b> &ndash; A model opened out of a dependency's archive resolves again. Its names were
        looked up in the project's index only, which such a file is not part of - so every
        <code>import</code> and every type in it was flagged, including the ones it declares itself. A
        model that is read rather than authored - an entry of an archive, or a file of a
        <code>local</code> directory outside the project - now resolves against the neighbours it was
        read beside, and reports nothing: the reader cannot act on the message, and a model publishing
        only part of itself legitimately names types it kept to itself.</li>
    <li><b>1.24.0</b> &ndash; <b>Breaking:</b> the <code>SrcGen4J</code> hint no longer describes where
        generated code goes with a <code>package</code> pattern and a <code>types</code> table. Two
        JavaScript functions decide instead, named by the hint and written next to the model:
        <code>model2JavaPackage(element, typeKey)</code> returns the Java package of a generated type,
        <code>artifact2Target(element, typeKey, artifactFactory)</code> the Maven module and folder its
        file is written to. A model that declares neither uses the mapping shipped with the templates,
        so most models need no hint at all. The two old keys are now rejected by the hint's JSON schema,
        which is what this release changes for the editor - an unmigrated model is reported here rather
        than generating into the wrong packages later.<br>
        <b>Breaking:</b> the artifact a <code>dependency</code> names is now resolved as a plain
        <code>zip</code> instead of a jar (still no classifier, still holding the <code>.cqrs</code>
        files below <code>model/</code>): the models are data and nothing in there belongs on a
        classpath. Re-publish a model artifact as a zip, otherwise its coordinate is reported as
        unresolvable. An artifact that resolves but cannot be read - not an archive as far as the IDE
        is concerned, or holding no models below <code>model/</code> - now says so on the coordinate
        instead of leaving every type it provides unresolved.</li>
    <li><b>1.23.1</b> &ndash; A <code>dependency</code> declared on a <code>context</code> now applies
        to every file of that context, as it already did in the SrcGen4J build. Until now the editor
        only saw a <code>dependency</code> written in the same file, so a context split across files
        &ndash; the dependency in one, the modules importing its types in the others &ndash; had every
        one of those imports reported as <code>does not match any context, module or type</code> while
        code generation resolved them fine. A <code>local</code> directory is resolved relative to the file
        that declares the dependency.<br>
        Code completion after <code>import</code> now offers the contexts, modules and types a
        dependency provides. Completion runs on a non-physical copy of the edited file, and that copy
        has no location on disk, so the dependencies were dropped and only what the project itself
        declares was proposed.</li>
    <li><b>1.23.0</b> &ndash; <b>Breaking:</b> the model has two levels instead of three.
        <code>project</code> is gone and the inner block is a <code>module</code>:
        <code>project P { context C { namespace N { X } } }</code> becomes
        <code>context P { module C.N { X } }</code>. Module names are qualified names, every element
        must live in a module, and every element keeps its fully qualified name.<br>
        <b>Breaking:</b> a module is the unit of visibility. Only what a module declares itself
        resolves by a simple name, so reaching any other module &ndash; a sibling of the same context
        included &ndash; needs an <code>import</code> over the <code>context.module.Type</code> path,
        optionally ending in a wildcard (<code>ctx.*</code>, <code>ctx.mod.*</code>,
        <code>ctx.mod.Type</code>). A fully qualified reference needs none.<br>
        <b>Breaking:</b> where models come from is declared in the model itself with
        <code>dependency "groupId:artifactId:version"</code> (optionally
        <code>local "../wip/src/main/cqrs"</code>), replacing the external
        <code>dependencies.json</code> catalog. A dependency makes models resolvable, an import
        decides what of them is visible.<br>
        <b>Breaking:</b> artifacts are resolved through <b>the IDE's own Maven</b> (the bundled Maven
        plugin, now required), so your <code>settings.xml</code> &ndash; local repository, remote
        repositories, mirrors, servers and proxies &ndash; applies as for any Maven project. A model
        artifact is a plain jar holding the <code>.cqrs</code> files under <code>model/</code>, mounted
        with <code>JarFileSystem</code> and read in place, so go-to-definition lands inside the jar and
        there is no <code>.dependencies-cache</code> directory. The <code>cqrs.*</code> system
        properties are gone.<br>
        New checks: an unresolvable or duplicate import is an error, an unused one a warning; a
        malformed, duplicated or unresolvable <code>dependency</code> is reported on its coordinate.
        Code completion offers only what the surrounding module reaches, and the importable paths
        after <code>import</code>. A quote is closed as it is typed and nothing is proposed inside a
        string, so writing a coordinate no longer pops up the keyword list at every dot.</li>
    <li><b>1.22.0</b> &ndash; The service an operation uses is now introduced by the
        <code>operation-context</code> keyword, instead of being written as a bare type name after the
        parameters where it looked like a parameter that had lost its name:
        <code>method rename { CategoryName newName  operation-context RenameService }</code>. The
        keyword is syntax-highlighted and offered in completion inside a constructor or method body,
        together with <code>service</code>, which was missing there. <b>Breaking:</b> every existing
        reference needs the keyword; the inline <code>service</code> declarations themselves are
        unchanged.<br>
        A typed cross-reference now also offers - and resolves to - only the kind of declaration the
        grammar allows there: an <code>operation-context</code> names a service, a view's
        <code>uses</code> a projection, <code>fires</code> an event, <code>identifier</code> an id,
        <code>invariants</code> a constraint, <code>target</code> an operation, and so on for every
        typed reference. Completion used to list every visible type at those positions, and a name of
        the wrong kind resolved silently while the build rejected it; it is now reported as unresolved,
        like any unknown name. A position the grammar declares as <code>[Type]</code> -
        <code>returns</code>, <code>instance-key</code>, an attribute or parameter type, a generic
        argument, a constraint's <code>input</code> - still takes any type.</li>
    <li><b>1.21.0</b> &ndash; Code completion inside a <code>business-rule</code> now offers the
        <code>consistency</code> clause and its values: <code>weak</code>/<code>strong</code>, the
        time units after <code>acceptable</code>, and the <code>detection</code>/
        <code>resolution</code> value sets. Previously it offered every visible type declaration
        there instead, and never the keywords. A half-typed <code>weak</code> details block also
        keeps its tokens, so completion still works while it is being written - a block missing
        <code>acceptable</code>, <code>detection</code> or <code>resolution</code> is now reported as
        a semantic error rather than a parse error. Separately, <code>null</code>/<code>true</code>/
        <code>false</code> are offered after <code>examples</code> and in an instance argument list,
        and <code>element</code> after <code>type</code>.</li>
    <li><b>1.20.0</b> &ndash; A view <code>method</code> may now declare an optional
        <code>rest-path</code> setting the sub path of its REST operation; without it the method name
        is used. <b>Breaking:</b> <code>rest-path</code> moved from the body into the header of
        <code>view</code> and <code>method</code>:
        <code>view X uses Y rest-path "/x" { ... }</code>. The keyword is syntax-highlighted and
        offered in completion at those header positions.</li>
    <li><b>1.19.0</b> &ndash; A <code>context</code> body may now mix <code>namespace</code> blocks
        and type/elements as siblings; previously it was an either/or (all namespaces, or imports and
        elements directly). Existing models are unaffected.</li>
    <li><b>1.18.0</b> &ndash; The process-manager <code>correlation-id</code> element was renamed to
        <code>instance-key</code> (it clashed with the unrelated event/command correlation id).
        <code>instance-key</code> names the value that identifies which running process instance an
        incoming event belongs to; it references any type, exactly as before. The keyword is
        syntax-highlighted and offered in context-aware completion inside a process-manager body.</li>
    <li><b>1.17.0</b> &ndash; A <code>JpaHint</code> table may now declare JPA associations to the
        other tables of the same hint: <code>@ManyToOne</code> (with a <code>@JoinColumn</code>, and
        <code>"foreignKey": "NO_CONSTRAINT"</code> to skip the database constraint) on the owning
        side, and <code>@OneToMany</code> (with <code>mappedBy</code>, <code>fetch</code>,
        <code>orphanRemoval</code> and <code>cascade</code>) on the inverse side. The new
        <code>manyToOnes</code> and <code>oneToManys</code> keys are validated live against the JSON
        schema.</li>
    <li><b>1.16.0</b> &ndash; A <code>view</code> body may now declare generator
        <code>hint</code>s (JSON-structured, like a <code>project</code>), placed right after the
        opening <code>{</code>. The <code>hint</code> keyword is syntax-highlighted and offered in
        context-aware completion inside a view body. A hint's JSON is now validated live against a
        JSON schema (<code>JpaHint</code> and <code>SrcGen4J</code>), and a <code>JpaHint</code>
        declared outside a <code>view</code> is flagged with a warning.</li>
    <li><b>1.15.0</b> &ndash; A <code>view</code> body may now declare an optional
        <code>rest-path</code> and <code>cron-schedule</code>: <code>rest-path</code> sets the base path
        of the generated REST controller (otherwise derived from the aggregate name) and
        <code>cron-schedule</code> sets the projection schedule (otherwise the default
        <code>* * * * * *</code>). Both keywords are syntax-highlighted and offered in context-aware
        completion inside a <code>view</code> body, and <code>cron-schedule</code> is validated as a
        Spring Boot cron expression (on a <code>view</code> and a <code>process-manager</code>).
        Grammar-only for now; code generation follows.</li>
    <li><b>1.14.0</b> &ndash; New <code>process-manager</code> element for modelling orchestration
        (sagas): it reacts to domain events and issues commands through a small, documented state
        machine &ndash; <code>process-states</code> plus guarded <code>reacts-to &lt;Event&gt; in-state
        &lt;State&gt;</code> reactions that <code>correlate-by</code> an event attribute,
        <code>issues-commands</code>, <code>transition-to</code> another state, and
        <code>arm-timeout</code>/<code>cancel-timeout</code>. Every state and reaction may carry its own
        doc comment. Grammar-only for now (like <code>command-handler</code>/<code>view</code>); code
        generation follows. The new keywords are syntax-highlighted and offered in context-aware
        completion (the manager clauses inside the block, the reaction clauses inside a
        <code>reacts-to</code>, and the time units after <code>arm-timeout</code>). Separately,
        <code>view</code> bodies now offer their <code>business-rule</code> and <code>method</code>
        keywords in completion.</li>
    <li><b>1.13.0</b> &ndash; A method's <code>returns</code> may now be declared
        <code>optional</code> (<code>returns optional String</code>), the same way an attribute or a
        parameter can, to express that the result may be absent. The code generation maps it to a
        <code>java.util.Optional</code> of the declared type.</li>
    <li><b>1.12.0</b> &ndash; A <code>view</code> may now declare <code>business-rule</code>s and
        <code>method</code>s in a body, the same way a <code>service</code> does, so the operations that query a
        read model can be modelled where the view is defined. The body is mandatory (it may be empty), so an
        existing <code>view X uses Y</code> becomes <code>view X uses Y { }</code>. A <code>projection</code> may
        be declared without any <code>input</code> events.</li>
    <li><b>1.11.0</b> &ndash; Two errors that the Eclipse plugin reports are no longer missed. A type
        that exists somewhere in the project but is <b>not imported</b> now shows as unresolved
        instead of silently resolving, and a command's <code>target</code> only accepts the method or
        constructor it triggers, so pointing it at an attribute is reported. Both cases used to look
        valid in the editor and then fail the build.</li>
    <li><b>1.10.0</b> &ndash; A value object with a <code>base</code> is no longer required to have
        exactly one attribute of the base type. Only "<code>base String</code> plus exactly one
        attribute" is generated as a complete class; every other shape becomes an abstract base class
        plus a hand-written final class supplying <code>asBaseType()</code>. Value objects such as
        <code>PhoneNumber</code>, which pack several attributes into one base representation, are
        legal and no longer flagged.</li>
    <li><b>1.9.0</b> &ndash; A method's <code>returns</code> type may now carry generic type
        arguments, written the same way as on attributes and parameters (e.g.
        <code>returns List&lt;Customer&gt;</code>). The referenced argument types are resolved and
        offered by code completion.</li>
    <li><b>1.7.0</b> &ndash; The <code>namespace</code> is now optional: a <code>context</code> may
        hold its imports and elements directly, without an enclosing <code>namespace</code>. Parsing,
        reference resolution and code completion all handle namespace-less contexts (an element
        declared directly in a context resolves under the <code>project.context</code> path).</li>
    <li><b>1.6.1</b> &ndash; Go-to-definition / find-usages no longer shows the same type several
        times ("Multiple Implementations"): declarations reachable through more than one scope path
        (a Maven artifact providing several imported namespaces, or a cached model also indexed as a
        project file) are now de-duplicated by source location.</li>
    <li><b>1.6.0</b> &ndash; Added code folding: every multi-line <code>{ }</code> block collapses
        individually (including an <code>enum</code>'s <code>instances</code> list and JSON
        <code>hint</code> bodies), as do multi-line block and doc comments. Nothing is collapsed when
        a file is opened.</li>
    <li><b>1.5.1</b> &ndash; Unresolvable cross-references are now shown as error.</li>
    <li><b>1.5.0</b> &ndash; Added project structure above context.</li>
    <li><b>1.4.1</b> &ndash; Code completion inside a <code>data-protection</code> block now offers
        the clause values: protection levels after <code>protection</code>, the lawful bases after
        <code>lawful-basis</code>, special categories after <code>category</code>, time units after a
        <code>retention</code> amount and erasure strategies after <code>then</code>. Parser error
        recovery for partially typed clauses was improved as well.</li>
    <li><b>1.4.0</b> &ndash; Added a data-protection (GDPR) concept: reusable
        <code>data-protection</code> policies (protection level, special category, data subject,
        purpose, lawful basis and a retention period with an erasure strategy) applied to types and
        attributes via <code>protected-by</code>. The attribute/parameter keyword
        <code>nullable</code> was renamed to <code>optional</code>, and the time units
        <code>weeks</code>, <code>months</code> and <code>years</code> were added.</li>
    <li><b>1.3.0</b> &ndash; A keyword can now be used as an identifier by prefixing it with a caret
        (e.g. <code>^event</code>). The caret marks the following word as a plain identifier and is
        not part of the name.</li>
    <li><b>1.2.0</b> &ndash; Dependency catalog is now Maven-only (the <code>simple</code> URL source
        was removed). Artifacts are cached once per Maven coordinate (GAV) instead of per namespace,
        so an artifact providing several namespaces is unpacked only once. A new <code>local</code>
        directory field reads <code>.cqrs</code> models straight from a folder without downloading.</li>
    <li><b>1.1.0</b> &ndash; Remote scope catalog now supports typed entries: a <code>simple</code>
        single-file source and a <code>maven</code> artifact (classifier <code>cqrs</code>,
        <code>tar.gz</code>) whose models are resolved and unpacked.</li>
    <li><b>1.0.2</b> &ndash; Code completion now offers available types when starting an attribute
        in a <code>value-object</code> or <code>constraint</code> body.</li>
    <li><b>1.0.1</b> &ndash; Added semantic validation (ported from the Eclipse validator),
        including the value-object <code>base</code> rules.</li>
    <li><b>1.0.0</b> &ndash; Initial release.</li>
</ul>'''

intellijPlatform {
    pluginConfiguration {
        description = project.ext.pluginDescription
        changeNotes = project.ext.pluginChangeNotes
        ideaVersion {
            sinceBuild = providers.gradleProperty('pluginSinceBuild')
            untilBuild = provider { null }
        }
    }
}

tasks.named('test', Test) {
    // The IntelliJ test fixtures expect the platform's own assertions enabled.
    useJUnit()
}

// ---------------------------------------------------------------------------
// Publishing to JFrog Artifactory as a custom IntelliJ plugin repository.
//
// The plugin zip and an `updatePlugins.xml` descriptor are uploaded to
//   <ARTIFACTORY_BASE>/<ARTIFACTORY_PATH>/<version>/   (immutable, versioned) and
//   <ARTIFACTORY_BASE>/<ARTIFACTORY_PATH>/latest/      (stable)
// so users can register the repository URL
//   <ARTIFACTORY_BASE>/<ARTIFACTORY_PATH>/latest/updatePlugins.xml
// under Settings | Plugins | Manage Plugin Repositories and install directly.
//
// Defaults mirror the Eclipse plugin publishing; the same P2_USER / P2_TOKEN
// credentials are reused. Override via env vars or -PartifactoryBase / -PartifactoryPath.
// ---------------------------------------------------------------------------

ext.pluginId = 'org.fuin.dsl.cqrs'
ext.pluginDisplayName = 'CQRS DSL'

String artifactoryBase() {
    def value = System.getenv('ARTIFACTORY_BASE') ?: findProperty('artifactoryBase') ?:
            'https://fuinorg.jfrog.io/artifactory/ddd-cqrs-dsl'
    return value.toString().replaceAll('/+$', '')
}

String artifactoryPath() {
    return (System.getenv('ARTIFACTORY_PATH') ?: findProperty('artifactoryPath') ?: 'cqrs-dsl-intellij').toString()
}

String updatePluginsXml(String id, String name, String version, String sinceBuild, String downloadUrl,
                        String description, String changeNotes) {
    return """<?xml version="1.0" encoding="UTF-8"?>
<plugins>
  <plugin id="${id}" url="${downloadUrl}" version="${version}">
    <name>${name}</name>
    <description><![CDATA[${description}]]></description>
    <change-notes><![CDATA[${changeNotes}]]></change-notes>
    <idea-version since-build="${sinceBuild}"/>
  </plugin>
</plugins>
"""
}

/**
 * Renders the change notes as Markdown. The HTML in {@code ext.pluginChangeNotes} is the single
 * source of truth (the marketplace and updatePlugins.xml need exactly that format); this is only the
 * readable mirror of it. Handles the subset of HTML the notes use: one {@code <li>} per version,
 * starting with the version in {@code <b>} followed by an en dash.
 */
String changeNotesMarkdown(String changeNotes) {
    def entries = (changeNotes =~ /(?s)<li>(.*?)<\/li>/).collect { it[1].toString() }
    def sb = new StringBuilder('# Changelog\n\n')
    sb.append('Generated from `ext.pluginChangeNotes` in [build.gradle](build.gradle) - do not edit.\n')
    entries.each { entry ->
        def matcher = entry =~ /(?s)^\s*<b>(.*?)<\/b>\s*&ndash;\s*(.*)$/
        if (!matcher) {
            throw new GradleException("Change note is not '<b>version</b> &ndash; text': ${entry}")
        }
        sb.append('\n## ').append(htmlToMarkdown(matcher[0][1].toString())).append('\n')
        sb.append('- ').append(htmlToMarkdown(matcher[0][2].toString())).append('\n')
    }
    return sb.toString()
}

/** Converts the inline HTML of a change note to Markdown and joins its wrapped lines. */
String htmlToMarkdown(String html) {
    return html.replaceAll(/(?s)<code>(.*?)<\/code>/, '`$1`')
            .replaceAll(/(?s)<b>(.*?)<\/b>/, '**$1**')
            .replace('&ndash;', '-')
            .replace('&lt;', '<')
            .replace('&gt;', '>')
            .replace('&quot;', '"')
            .replace('&nbsp;', ' ')
            // Last: an escaped ampersand must not turn another entity into a literal
            .replace('&amp;', '&')
            .replaceAll(/\s+/, ' ')
            .trim()
}

void httpPut(String urlStr, File file, String user, String token) {
    def client = java.net.http.HttpClient.newHttpClient()
    def auth = Base64.encoder.encodeToString("${user}:${token}".getBytes('UTF-8'))
    def request = java.net.http.HttpRequest.newBuilder()
            .uri(java.net.URI.create(urlStr))
            .header('Authorization', "Basic ${auth}")
            .PUT(java.net.http.HttpRequest.BodyPublishers.ofFile(file.toPath()))
            .build()
    def response = client.send(request, java.net.http.HttpResponse.BodyHandlers.ofString())
    int code = response.statusCode()
    if (code < 200 || code >= 300) {
        throw new GradleException("Upload failed (HTTP ${code}) for ${urlStr}\n${response.body()}")
    }
    logger.lifecycle("  ${urlStr} -> ${code}")
}

def generateChangeLog = tasks.register('generateChangeLog') {
    description = 'Generates CHANGELOG.md from the change notes in this build script.'
    group = 'documentation'
    def changeNotes = project.ext.pluginChangeNotes.toString()
    def outFile = file('CHANGELOG.md')
    // Only rewritten when the notes actually change
    inputs.property('changeNotes', changeNotes)
    outputs.file(outFile)
    doLast {
        outFile.text = changeNotesMarkdown(changeNotes)
        logger.lifecycle("Wrote ${outFile}")
    }
}

def generateUpdatePlugins = tasks.register('generateUpdatePlugins') {
    description = 'Generates the updatePlugins.xml descriptor for the custom plugin repository.'
    group = 'intellij platform'
    dependsOn 'buildPlugin'
    def outFile = layout.buildDirectory.file('distributions/updatePlugins.xml')
    def sinceBuild = providers.gradleProperty('pluginSinceBuild')
    def version = project.version.toString()
    def zipFile = tasks.named('buildPlugin').flatMap { it.archiveFile }
    outputs.file(outFile)
    doLast {
        def zipName = zipFile.get().asFile.name
        def downloadUrl = "${artifactoryBase()}/${artifactoryPath()}/latest/${zipName}"
        def target = outFile.get().asFile
        target.parentFile.mkdirs()
        target.text = updatePluginsXml(pluginId, pluginDisplayName, version, sinceBuild.get(), downloadUrl,
                project.ext.pluginDescription, project.ext.pluginChangeNotes)
        logger.lifecycle("Wrote ${target} (download URL: ${downloadUrl})")
    }
}

// Produce updatePlugins.xml whenever the plugin is assembled.
tasks.named('buildPlugin') { finalizedBy generateUpdatePlugins }
tasks.named('build') { dependsOn generateUpdatePlugins }

// Keep CHANGELOG.md in sync with the change notes.
tasks.named('build') { dependsOn generateChangeLog }

tasks.register('publishToArtifactory') {
    description = 'Uploads the plugin zip and updatePlugins.xml to JFrog Artifactory.'
    group = 'publishing'
    dependsOn 'buildPlugin'
    def sinceBuild = providers.gradleProperty('pluginSinceBuild')
    def version = project.version.toString()
    def zipFile = tasks.named('buildPlugin').flatMap { it.archiveFile }
    def stageDir = layout.buildDirectory.dir('artifactory')
    doLast {
        def user = System.getenv('P2_USER')
        def token = System.getenv('P2_TOKEN')
        if (!user || !token) {
            throw new GradleException('Set P2_USER and P2_TOKEN (Artifactory credentials) in the environment.')
        }
        def base = artifactoryBase()
        def path = artifactoryPath()
        def zip = zipFile.get().asFile
        def zipName = zip.name

        // Upload an immutable versioned copy and refresh the stable 'latest' copy.
        [version, 'latest'].each { destPrefix ->
            def destBase = "${base}/${path}/${destPrefix}"
            def downloadUrl = "${destBase}/${zipName}"
            def xmlFile = stageDir.get().file("${destPrefix}/updatePlugins.xml").asFile
            xmlFile.parentFile.mkdirs()
            xmlFile.text = updatePluginsXml(pluginId, pluginDisplayName, version, sinceBuild.get(), downloadUrl,
                    project.ext.pluginDescription, project.ext.pluginChangeNotes)

            logger.lifecycle("Publishing ${zipName} to ${destBase}")
            httpPut(downloadUrl, zip, user, token)
            httpPut("${destBase}/updatePlugins.xml", xmlFile, user, token)
        }
        logger.lifecycle("Done. Plugin repository URL: ${base}/${path}/latest/updatePlugins.xml")
    }
}
