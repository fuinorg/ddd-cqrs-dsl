import org.jetbrains.grammarkit.tasks.GenerateLexerTask
import org.jetbrains.grammarkit.tasks.GenerateParserTask
import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.16.0'
    id 'org.jetbrains.grammarkit' version '2022.3.2.2'
}

group = providers.gradleProperty('pluginGroup').get()
version = providers.gradleProperty('pluginVersion').get()

repositories {
    mavenCentral()
    // Grammar-Kit generator tool + its IntelliJ-core (223) dependencies, including the
    // transitive ai.grazie.* artifacts pulled in by the 223 platform used for code generation.
    maven { url = 'https://cache-redirector.jetbrains.com/intellij-dependencies' }
    maven { url = 'https://cache-redirector.jetbrains.com/packages.jetbrains.team/maven/p/grazi/grazie-platform-public' }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        // Since 2025.3 (253) the separate Community artifact (ideaIC) is no longer published;
        // 2026.1 uses the unified IntelliJ IDEA distribution.
        intellijIdea providers.gradleProperty('platformVersion')
        testFramework TestFrameworkType.Platform.INSTANCE
    }
    // Gson is bundled with the IntelliJ Platform, so it is provided at runtime; compile against it only.
    compileOnly 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// ---------------------------------------------------------------------------
// Grammar-Kit: generate the lexer (JFlex) and the parser/PSI (BNF).
// Both are emitted under build/generated/sources/grammarkit, which is added to
// the main source set below.
// ---------------------------------------------------------------------------
// The Grammar-Kit generator's LightPsi bootstrap needs a 2022.3 (build 223) IntelliJ core on its
// classpath (it is not self-contained). Rather than pull the whole platform via intellijRelease
// (which drags in unresolvable transitive deps), add just the minimal core artifact. This only
// affects code generation — the compiled plugin targets 2026.1.
dependencies {
    grammarKitClassPath 'org.jetbrains:grammar-kit:2022.3.2'
    grammarKitClassPath 'org.jetbrains.intellij.deps.jflex:jflex:1.9.2'
    grammarKitClassPath 'com.jetbrains.intellij.platform:core-impl:223.8836.41'
    grammarKitClassPath 'com.jetbrains.intellij.platform:lang:223.8836.41'
    grammarKitClassPath 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.6.4'
    // Grammar-Kit reads PSI method signatures via ASM; without it the reflection fallback throws
    // a ClassCastException that aborts PSI-impl generation.
    grammarKitClassPath 'org.jetbrains.intellij.deps:asm-all:9.2'
}

def generatedRoot = layout.buildDirectory.dir('generated/sources/grammarkit')

// The 223 core predates JDK 25; pin the generation tasks to a Java 21 toolchain.
def generatorLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

def generateCqrsParser = tasks.register('generateCqrsParser', GenerateParserTask) {
    sourceFile = file('src/main/grammar/CqrsDsl.bnf')
    targetRootOutputDir = generatedRoot
    pathToParser = 'org/fuin/dsl/cqrs/intellij/parser/CqrsParser.java'
    pathToPsiRoot = 'org/fuin/dsl/cqrs/intellij/psi'
    purgeOldFiles = true
    javaLauncher = generatorLauncher
}

def generateCqrsLexer = tasks.register('generateCqrsLexer', GenerateLexerTask) {
    sourceFile = file('src/main/grammar/CqrsDsl.flex')
    // JFlex writes <class>.java directly into this directory, so it must match the package path.
    targetOutputDir = generatedRoot.map { it.dir('org/fuin/dsl/cqrs/intellij/lexer') }
    purgeOldFiles = true
    javaLauncher = generatorLauncher
    dependsOn generateCqrsParser
}

sourceSets {
    main {
        java {
            srcDir generatedRoot
        }
    }
}

tasks.named('compileJava') {
    dependsOn generateCqrsLexer, generateCqrsParser
}

// Single source of truth for the marketplace texts. These feed both the patched plugin.xml
// (Overview / What's new for an installed plugin) and the custom repository's updatePlugins.xml
// (Overview / What's new shown while browsing the repository before install).
ext.pluginDescription = '''\
Editor support for the DDD/CQRS DSL (<code>*.cqrs</code> files): syntax highlighting and
code completion for contexts, namespaces, value-objects, entities, aggregates, events,
commands, exceptions and more.
<ul>
    <li>Syntax highlighting (keywords, strings, numbers, comments, doc comments).</li>
    <li>Reference-aware code completion, go-to-definition, find-usages and rename.</li>
    <li>Code folding for <code>{ }</code> blocks and multi-line comments.</li>
    <li>Structure view of the domain model.</li>
    <li>Resolution of remote references via a <code>dependencies.json</code> catalog &ndash; from a
        Maven <code>tar.gz</code> artifact (or a <code>local</code> directory) &ndash; interoperable
        with the Eclipse plugin's <code>.dependencies-cache</code>.</li>
</ul>
Licensed under LGPL v3.'''

ext.pluginChangeNotes = '''\
<ul>
    <li><b>1.15.0</b> &ndash; A <code>view</code> body may now declare an optional
        <code>rest-path</code> and <code>cron-schedule</code>: <code>rest-path</code> sets the base path
        of the generated REST controller (otherwise derived from the aggregate name) and
        <code>cron-schedule</code> sets the projection schedule (otherwise the default
        <code>* * * * * *</code>). Both keywords are syntax-highlighted and offered in context-aware
        completion inside a <code>view</code> body, and <code>cron-schedule</code> is validated as a
        Spring Boot cron expression (on a <code>view</code> and a <code>process-manager</code>).
        Grammar-only for now; code generation follows.</li>
    <li><b>1.14.0</b> &ndash; New <code>process-manager</code> element for modelling orchestration
        (sagas): it reacts to domain events and issues commands through a small, documented state
        machine &ndash; <code>process-states</code> plus guarded <code>reacts-to &lt;Event&gt; in-state
        &lt;State&gt;</code> reactions that <code>correlate-by</code> an event attribute,
        <code>issues-commands</code>, <code>transition-to</code> another state, and
        <code>arm-timeout</code>/<code>cancel-timeout</code>. Every state and reaction may carry its own
        doc comment. Grammar-only for now (like <code>command-handler</code>/<code>view</code>); code
        generation follows. The new keywords are syntax-highlighted and offered in context-aware
        completion (the manager clauses inside the block, the reaction clauses inside a
        <code>reacts-to</code>, and the time units after <code>arm-timeout</code>). Separately,
        <code>view</code> bodies now offer their <code>business-rule</code> and <code>method</code>
        keywords in completion.</li>
    <li><b>1.13.0</b> &ndash; A method's <code>returns</code> may now be declared
        <code>optional</code> (<code>returns optional String</code>), the same way an attribute or a
        parameter can, to express that the result may be absent. The code generation maps it to a
        <code>java.util.Optional</code> of the declared type.</li>
    <li><b>1.12.0</b> &ndash; A <code>view</code> may now declare <code>business-rule</code>s and
        <code>method</code>s in a body, the same way a <code>service</code> does, so the operations that query a
        read model can be modelled where the view is defined. The body is mandatory (it may be empty), so an
        existing <code>view X uses Y</code> becomes <code>view X uses Y { }</code>. A <code>projection</code> may
        be declared without any <code>input</code> events.</li>
    <li><b>1.11.0</b> &ndash; Two errors that the Eclipse plugin reports are no longer missed. A type
        that exists somewhere in the project but is <b>not imported</b> now shows as unresolved
        instead of silently resolving, and a command's <code>target</code> only accepts the method or
        constructor it triggers, so pointing it at an attribute is reported. Both cases used to look
        valid in the editor and then fail the build.</li>
    <li><b>1.10.0</b> &ndash; A value object with a <code>base</code> is no longer required to have
        exactly one attribute of the base type. Only "<code>base String</code> plus exactly one
        attribute" is generated as a complete class; every other shape becomes an abstract base class
        plus a hand-written final class supplying <code>asBaseType()</code>. Value objects such as
        <code>PhoneNumber</code>, which pack several attributes into one base representation, are
        legal and no longer flagged.</li>
    <li><b>1.9.0</b> &ndash; A method's <code>returns</code> type may now carry generic type
        arguments, written the same way as on attributes and parameters (e.g.
        <code>returns List&lt;Customer&gt;</code>). The referenced argument types are resolved and
        offered by code completion.</li>
    <li><b>1.7.0</b> &ndash; The <code>namespace</code> is now optional: a <code>context</code> may
        hold its imports and elements directly, without an enclosing <code>namespace</code>. Parsing,
        reference resolution and code completion all handle namespace-less contexts (an element
        declared directly in a context resolves under the <code>project.context</code> path).</li>
    <li><b>1.6.1</b> &ndash; Go-to-definition / find-usages no longer shows the same type several
        times ("Multiple Implementations"): declarations reachable through more than one scope path
        (a Maven artifact providing several imported namespaces, or a cached model also indexed as a
        project file) are now de-duplicated by source location.</li>
    <li><b>1.6.0</b> &ndash; Added code folding: every multi-line <code>{ }</code> block collapses
        individually (including an <code>enum</code>'s <code>instances</code> list and JSON
        <code>hint</code> bodies), as do multi-line block and doc comments. Nothing is collapsed when
        a file is opened.</li>
    <li><b>1.5.1</b> &ndash; Unresolvable cross-references are now shown as error.</li>
    <li><b>1.5.0</b> &ndash; Added project structure above context.</li>
    <li><b>1.4.1</b> &ndash; Code completion inside a <code>data-protection</code> block now offers
        the clause values: protection levels after <code>protection</code>, the lawful bases after
        <code>lawful-basis</code>, special categories after <code>category</code>, time units after a
        <code>retention</code> amount and erasure strategies after <code>then</code>. Parser error
        recovery for partially typed clauses was improved as well.</li>
    <li><b>1.4.0</b> &ndash; Added a data-protection (GDPR) concept: reusable
        <code>data-protection</code> policies (protection level, special category, data subject,
        purpose, lawful basis and a retention period with an erasure strategy) applied to types and
        attributes via <code>protected-by</code>. The attribute/parameter keyword
        <code>nullable</code> was renamed to <code>optional</code>, and the time units
        <code>weeks</code>, <code>months</code> and <code>years</code> were added.</li>
    <li><b>1.3.0</b> &ndash; A keyword can now be used as an identifier by prefixing it with a caret
        (e.g. <code>^event</code>). The caret marks the following word as a plain identifier and is
        not part of the name.</li>
    <li><b>1.2.0</b> &ndash; Dependency catalog is now Maven-only (the <code>simple</code> URL source
        was removed). Artifacts are cached once per Maven coordinate (GAV) instead of per namespace,
        so an artifact providing several namespaces is unpacked only once. A new <code>local</code>
        directory field reads <code>.cqrs</code> models straight from a folder without downloading.</li>
    <li><b>1.1.0</b> &ndash; Remote scope catalog now supports typed entries: a <code>simple</code>
        single-file source and a <code>maven</code> artifact (classifier <code>cqrs</code>,
        <code>tar.gz</code>) whose models are resolved and unpacked.</li>
    <li><b>1.0.2</b> &ndash; Code completion now offers available types when starting an attribute
        in a <code>value-object</code> or <code>constraint</code> body.</li>
    <li><b>1.0.1</b> &ndash; Added semantic validation (ported from the Eclipse validator),
        including the value-object <code>base</code> rules.</li>
    <li><b>1.0.0</b> &ndash; Initial release.</li>
</ul>'''

intellijPlatform {
    pluginConfiguration {
        description = project.ext.pluginDescription
        changeNotes = project.ext.pluginChangeNotes
        ideaVersion {
            sinceBuild = providers.gradleProperty('pluginSinceBuild')
            untilBuild = provider { null }
        }
    }
}

tasks.named('test', Test) {
    // The IntelliJ test fixtures expect the platform's own assertions enabled.
    useJUnit()
}

// ---------------------------------------------------------------------------
// Publishing to JFrog Artifactory as a custom IntelliJ plugin repository.
//
// The plugin zip and an `updatePlugins.xml` descriptor are uploaded to
//   <ARTIFACTORY_BASE>/<ARTIFACTORY_PATH>/<version>/   (immutable, versioned) and
//   <ARTIFACTORY_BASE>/<ARTIFACTORY_PATH>/latest/      (stable)
// so users can register the repository URL
//   <ARTIFACTORY_BASE>/<ARTIFACTORY_PATH>/latest/updatePlugins.xml
// under Settings | Plugins | Manage Plugin Repositories and install directly.
//
// Defaults mirror the Eclipse plugin publishing; the same P2_USER / P2_TOKEN
// credentials are reused. Override via env vars or -PartifactoryBase / -PartifactoryPath.
// ---------------------------------------------------------------------------

ext.pluginId = 'org.fuin.dsl.cqrs'
ext.pluginDisplayName = 'CQRS DSL'

String artifactoryBase() {
    def value = System.getenv('ARTIFACTORY_BASE') ?: findProperty('artifactoryBase') ?:
            'https://fuinorg.jfrog.io/artifactory/ddd-cqrs-dsl'
    return value.toString().replaceAll('/+$', '')
}

String artifactoryPath() {
    return (System.getenv('ARTIFACTORY_PATH') ?: findProperty('artifactoryPath') ?: 'cqrs-dsl-intellij').toString()
}

String updatePluginsXml(String id, String name, String version, String sinceBuild, String downloadUrl,
                        String description, String changeNotes) {
    return """<?xml version="1.0" encoding="UTF-8"?>
<plugins>
  <plugin id="${id}" url="${downloadUrl}" version="${version}">
    <name>${name}</name>
    <description><![CDATA[${description}]]></description>
    <change-notes><![CDATA[${changeNotes}]]></change-notes>
    <idea-version since-build="${sinceBuild}"/>
  </plugin>
</plugins>
"""
}

/**
 * Renders the change notes as Markdown. The HTML in {@code ext.pluginChangeNotes} is the single
 * source of truth (the marketplace and updatePlugins.xml need exactly that format); this is only the
 * readable mirror of it. Handles the subset of HTML the notes use: one {@code <li>} per version,
 * starting with the version in {@code <b>} followed by an en dash.
 */
String changeNotesMarkdown(String changeNotes) {
    def entries = (changeNotes =~ /(?s)<li>(.*?)<\/li>/).collect { it[1].toString() }
    def sb = new StringBuilder('# Changelog\n\n')
    sb.append('Generated from `ext.pluginChangeNotes` in [build.gradle](build.gradle) - do not edit.\n')
    entries.each { entry ->
        def matcher = entry =~ /(?s)^\s*<b>(.*?)<\/b>\s*&ndash;\s*(.*)$/
        if (!matcher) {
            throw new GradleException("Change note is not '<b>version</b> &ndash; text': ${entry}")
        }
        sb.append('\n## ').append(htmlToMarkdown(matcher[0][1].toString())).append('\n')
        sb.append('- ').append(htmlToMarkdown(matcher[0][2].toString())).append('\n')
    }
    return sb.toString()
}

/** Converts the inline HTML of a change note to Markdown and joins its wrapped lines. */
String htmlToMarkdown(String html) {
    return html.replaceAll(/(?s)<code>(.*?)<\/code>/, '`$1`')
            .replaceAll(/(?s)<b>(.*?)<\/b>/, '**$1**')
            .replace('&ndash;', '-')
            .replace('&lt;', '<')
            .replace('&gt;', '>')
            .replace('&quot;', '"')
            .replace('&nbsp;', ' ')
            // Last: an escaped ampersand must not turn another entity into a literal
            .replace('&amp;', '&')
            .replaceAll(/\s+/, ' ')
            .trim()
}

void httpPut(String urlStr, File file, String user, String token) {
    def client = java.net.http.HttpClient.newHttpClient()
    def auth = Base64.encoder.encodeToString("${user}:${token}".getBytes('UTF-8'))
    def request = java.net.http.HttpRequest.newBuilder()
            .uri(java.net.URI.create(urlStr))
            .header('Authorization', "Basic ${auth}")
            .PUT(java.net.http.HttpRequest.BodyPublishers.ofFile(file.toPath()))
            .build()
    def response = client.send(request, java.net.http.HttpResponse.BodyHandlers.ofString())
    int code = response.statusCode()
    if (code < 200 || code >= 300) {
        throw new GradleException("Upload failed (HTTP ${code}) for ${urlStr}\n${response.body()}")
    }
    logger.lifecycle("  ${urlStr} -> ${code}")
}

def generateChangeLog = tasks.register('generateChangeLog') {
    description = 'Generates CHANGELOG.md from the change notes in this build script.'
    group = 'documentation'
    def changeNotes = project.ext.pluginChangeNotes.toString()
    def outFile = file('CHANGELOG.md')
    // Only rewritten when the notes actually change
    inputs.property('changeNotes', changeNotes)
    outputs.file(outFile)
    doLast {
        outFile.text = changeNotesMarkdown(changeNotes)
        logger.lifecycle("Wrote ${outFile}")
    }
}

def generateUpdatePlugins = tasks.register('generateUpdatePlugins') {
    description = 'Generates the updatePlugins.xml descriptor for the custom plugin repository.'
    group = 'intellij platform'
    dependsOn 'buildPlugin'
    def outFile = layout.buildDirectory.file('distributions/updatePlugins.xml')
    def sinceBuild = providers.gradleProperty('pluginSinceBuild')
    def version = project.version.toString()
    def zipFile = tasks.named('buildPlugin').flatMap { it.archiveFile }
    outputs.file(outFile)
    doLast {
        def zipName = zipFile.get().asFile.name
        def downloadUrl = "${artifactoryBase()}/${artifactoryPath()}/latest/${zipName}"
        def target = outFile.get().asFile
        target.parentFile.mkdirs()
        target.text = updatePluginsXml(pluginId, pluginDisplayName, version, sinceBuild.get(), downloadUrl,
                project.ext.pluginDescription, project.ext.pluginChangeNotes)
        logger.lifecycle("Wrote ${target} (download URL: ${downloadUrl})")
    }
}

// Produce updatePlugins.xml whenever the plugin is assembled.
tasks.named('buildPlugin') { finalizedBy generateUpdatePlugins }
tasks.named('build') { dependsOn generateUpdatePlugins }

// Keep CHANGELOG.md in sync with the change notes.
tasks.named('build') { dependsOn generateChangeLog }

tasks.register('publishToArtifactory') {
    description = 'Uploads the plugin zip and updatePlugins.xml to JFrog Artifactory.'
    group = 'publishing'
    dependsOn 'buildPlugin'
    def sinceBuild = providers.gradleProperty('pluginSinceBuild')
    def version = project.version.toString()
    def zipFile = tasks.named('buildPlugin').flatMap { it.archiveFile }
    def stageDir = layout.buildDirectory.dir('artifactory')
    doLast {
        def user = System.getenv('P2_USER')
        def token = System.getenv('P2_TOKEN')
        if (!user || !token) {
            throw new GradleException('Set P2_USER and P2_TOKEN (Artifactory credentials) in the environment.')
        }
        def base = artifactoryBase()
        def path = artifactoryPath()
        def zip = zipFile.get().asFile
        def zipName = zip.name

        // Upload an immutable versioned copy and refresh the stable 'latest' copy.
        [version, 'latest'].each { destPrefix ->
            def destBase = "${base}/${path}/${destPrefix}"
            def downloadUrl = "${destBase}/${zipName}"
            def xmlFile = stageDir.get().file("${destPrefix}/updatePlugins.xml").asFile
            xmlFile.parentFile.mkdirs()
            xmlFile.text = updatePluginsXml(pluginId, pluginDisplayName, version, sinceBuild.get(), downloadUrl,
                    project.ext.pluginDescription, project.ext.pluginChangeNotes)

            logger.lifecycle("Publishing ${zipName} to ${destBase}")
            httpPut(downloadUrl, zip, user, token)
            httpPut("${destBase}/updatePlugins.xml", xmlFile, user, token)
        }
        logger.lifecycle("Done. Plugin repository URL: ${base}/${path}/latest/updatePlugins.xml")
    }
}
