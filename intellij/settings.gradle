pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Auto-provisions the Java 21 toolchain used by the Grammar-Kit code generation tasks
    // on machines/CI where it is not already installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'ddd-cqrs-dsl-intellij'
