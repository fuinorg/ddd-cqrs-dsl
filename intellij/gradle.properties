# Plugin coordinates
pluginGroup = org.fuin.dsl
pluginVersion = 1.30.0

# Target IntelliJ Platform (IntelliJ IDEA 2026.1)
platformVersion = 2026.1

# Plugin compatibility range
pluginSinceBuild = 261

# Bundled plugins kept off the unit-test classpath.
#
# Since IntelliJ Platform Gradle Plugin 2.18, the test classpath is composed from the IDE's
# product-info layout index, which puts every bundled plugin on it - not only the two this plugin
# actually asks for. Vue registers a VFS listener whose activation rule cannot initialise without
# the rest of its own dependencies, so tearing down a test's source root logs an error, and
# TestLoggerFactory turns a logged error into a failed test. Excluding it is the mechanism the
# platform plugin provides for exactly this.
#
# com.intellij.openRewrite is the property's own default and has to be repeated, because setting
# the property replaces the default rather than adding to it.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes = com.intellij.openRewrite,org.jetbrains.plugins.vue

# Gradle
# The configuration cache is not enabled here. What used to prevent it - the standalone Grammar-Kit
# plugin (2022.3.2.2) - is gone, and 'test' does run under it since the migration. It is left off
# because the publishing and Artifactory upload tasks have not been checked against it, and a cache
# that fails only on a release is worse than no cache.
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC

# Let Gradle discover JDKs that GitHub's setup-java exposes, so the Java 21 toolchain used for
# code generation is found in CI (locally, SDKMAN/standard installs are auto-detected).
org.gradle.java.installations.fromEnv = JAVA_HOME_21_X64,JAVA_HOME_25_X64
